<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Entrega de Provas - Laboratório</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sistema de Entrega de Provas</h1>
            <p>Laboratório de Informática</p>
        </header>

        <main>
            <div class="card">
                <h2>Download da Prova</h2>
                <p>Para começar, faça o download da prova:</p>
                <div id="provas-list">
                    <!-- List of available files will be populated by JavaScript -->
                    <p>Carregando provas disponíveis...</p>
                </div>
            </div>

            <div class="card">
                <h2>Envio de Respostas</h2>
                <form id="uploadForm" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="aluno">Nome do Aluno:</label>
                        <input type="text" id="aluno" name="aluno" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="resposta">Arquivo ZIP com Respostas:</label>
                        <input type="file" id="resposta" name="resposta" accept=".zip" required>
                    </div>
                    
                    <button type="submit" class="btn btn-success">Enviar Respostas</button>
                </form>
                
                <div id="status"></div>
            </div>
        </main>

        <footer>
            <p>Sistema de Entrega de Provas - Laboratório de Informática</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        // Load available proofs when page loads
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/provas')
                .then(response => response.json())
                .then(data => {
                    const provasList = document.getElementById('provas-list');
                    if (data.files && data.files.length > 0) {
                        let html = '<p>Provas disponíveis:</p><ul>';
                        data.files.forEach(file => {
                            html += `<li><a href="/prova/${file}" class="btn btn-primary">${file}</a></li>`;
                        });
                        html += '</ul>';
                        provasList.innerHTML = html;
                    } else {
                        provasList.innerHTML = '<p>Nenhuma prova disponível.</p>';
                    }
                })
                .catch(error => {
                    console.error('Erro ao carregar provas:', error);
                    document.getElementById('provas-list').innerHTML = '<p>Erro ao carregar provas disponíveis.</p>';
                });
        });
    </script>
</body>
</html>
